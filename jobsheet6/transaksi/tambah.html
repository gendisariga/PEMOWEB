<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Jadwal | PawCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Klinik Hewan Winadivet</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-btn">☰</button>
        <nav>
            <ul>
                <li><a href="../index.html"><span class="nav-icon">🏠</span>Beranda</a></li>
                <li><a href="../paket/list.html"><span class="nav-icon">🩺</span>Layanan</a></li>
                <li><a href="../pelanggan/list.html"><span class="nav-icon">🐾</span>Data Hewan</a></li>
                <li><a href="list.html"><span class="nav-icon">📅</span>Jadwal</a></li>
                <li><a href="../login.html" class="login-nav-link"><span class="nav-icon">🔐</span>Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Jadwal Pemeriksaan</h2>

            <form id="form-tambah">
                <div class="mb-3">
                    <label for="pelanggan" class="form-label">Nama Pemilik</label>
                    <input type="text" id="pelanggan" name="pelanggan" class="form-control" placeholder="Nama pemilik">
                </div>

                <div class="mb-3">
                    <label for="paket" class="form-label">Hewan</label>
                    <input type="text" id="paket" name="paket" class="form-control" placeholder="Nama hewan">
                </div>

                <div class="mb-3">
                    <label for="berat" class="form-label">Jenis Layanan</label>
                    <input type="text" id="berat" name="berat" class="form-control" placeholder="Contoh: Vaksin / Check Up / Grooming">
                </div>

                <div class="mb-3">
                    <label for="total" class="form-label">Waktu</label>
                    <input type="text" id="total" name="total" class="form-control" placeholder="Contoh: 10.00 WIB">
                </div>

                <button type="submit" class="btn btn-primary">Simpan</button>
                <a href="list.html" class="btn btn-secondary">Kembali</a>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Klinik Hewan Winadivet &mdash; Sistem Klinik Hewan</p>
    </footer>

    <script src="../assets/js/app.js"></script>
</body>
</html>
