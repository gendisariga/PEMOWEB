<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Layanan | PawCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Klinik Hewan Winadivet</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-btn">☰</button>
        <nav>
            <ul>
                <li><a href="../index.html"><span class="nav-icon">🏠</span>Beranda</a></li>
                <li><a href="list.html"><span class="nav-icon">🩺</span>Layanan</a></li>
                <li><a href="tambah.html"><span class="nav-icon">➕</span>Tambah Layanan</a></li>
                <li><a href="../pelanggan/list.html"><span class="nav-icon">🐾</span>Data Hewan</a></li>
                <li><a href="../transaksi/list.html"><span class="nav-icon">📅</span>Jadwal</a></li>
                <li><a href="../login.html" class="login-nav-link"><span class="nav-icon">🔐</span>Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Layanan Klinik</h2>

            <form id="form-tambah">
                <div class="mb-3">
                    <label for="nama_paket" class="form-label">Nama Layanan</label>
                    <input type="text" id="nama_paket" name="nama_paket" class="form-control" placeholder="Contoh: Vaksin Rabies">
                </div>

                <div class="mb-3">
                    <label for="jenis" class="form-label">Jenis</label>
                    <input type="text" id="jenis" name="jenis" class="form-control" placeholder="Contoh: Kesehatan / Grooming / Vaksin">
                </div>

                <div class="mb-3">
                    <label for="harga" class="form-label">Harga</label>
                    <input type="number" id="harga" name="harga" class="form-control" placeholder="Masukkan harga">
                </div>

                <div class="mb-3">
                    <label for="estimasi" class="form-label">Estimasi</label>
                    <input type="text" id="estimasi" name="estimasi" class="form-control" placeholder="Contoh: 1 hari">
                </div>

                <button type="submit" class="btn btn-primary">Simpan</button>
                <a href="list.html" class="btn btn-secondary">Kembali</a>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Klinik Hewan Winadivet &mdash; Sistem Klinik Hewan</p>
    </footer>

    <script src="../assets/js/app.js"></script>
</body>
</html>
