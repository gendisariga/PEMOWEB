<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tambah Hewan | PawCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>Klinik Hewan Winadivet</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle-btn">☰</button>
        <nav>
            <ul>
                <li><a href="../index.html"><span class="nav-icon">🏠</span>Beranda</a></li>
                <li><a href="../paket/list.html"><span class="nav-icon">🩺</span>Layanan</a></li>
                <li><a href="list.html"><span class="nav-icon">🐾</span>Data Hewan</a></li>
                <li><a href="tambah.html"><span class="nav-icon">➕</span>Tambah Hewan</a></li>
                <li><a href="../transaksi/list.html"><span class="nav-icon">📅</span>Jadwal</a></li>
                <li><a href="../login.html" class="login-nav-link"><span class="nav-icon">🔐</span>Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Data Hewan</h2>

            <form id="form-tambah">
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama Hewan</label>
                    <input type="text" id="nama" name="nama" class="form-control" placeholder="Masukkan nama hewan">
                </div>

                <div class="mb-3">
                    <label for="no_pelanggan" class="form-label">No. Hewan</label>
                    <input type="text" id="no_pelanggan" name="no_pelanggan" class="form-control" placeholder="Contoh: H003">
                </div>

                <div class="mb-3">
                    <label for="alamat" class="form-label">Jenis Hewan</label>
                    <input type="text" id="alamat" name="alamat" class="form-control" placeholder="Contoh: Kucing / Anjing / Kelinci">
                </div>

                <div class="mb-3">
                    <label for="no_hp" class="form-label">Nama Pemilik</label>
                    <input type="text" id="no_hp" name="no_hp" class="form-control" placeholder="Masukkan nama pemilik">
                </div>

                <button type="submit" class="btn btn-primary">Simpan</button>
                <a href="list.html" class="btn btn-secondary">Kembali</a>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Klinik Hewan Winadivet &mdash; Sistem Klinik Hewan</p>
    </footer>

    <script src="../assets/js/app.js"></script>
</body>
</html>
